server:
  port: 8000

spring:
  application:
    name: payment-service

# ============================================
# 🛡️ RESILIENCE4J CIRCUIT BREAKER CONFIG
# ============================================
resilience4j:
  circuitbreaker:
    instances:
      paymentServiceCB:                          # ← payment Service CB
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10



  retry:
    instances:
      paymentServiceRetry:
        maxAttempts: 3
        waitDuration: 1s

  timelimiter:
    instances:
      paymentServiceCB:
        timeoutDuration: 5s


