server:
  port: 7000

spring:
  application:
    name: order-service

# ============================================
# 🔍 EUREKA CONFIGURATION
# ============================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30       # Registry refresh interval
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 30     # ✅ Heartbeat har 30s
    lease-expiration-duration-in-seconds: 90  # ✅ 90s tak dead

# ============================================
# 🛡️ RESILIENCE4J CONFIG
# ============================================
resilience4j:
  circuitbreaker:
    instances:
      orderServiceCB:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

  retry:
    instances:
      orderServiceRetry:
        maxAttempts: 3
        waitDuration: 1s

  timelimiter:
    instances:
      orderServiceCB:
        timeoutDuration: 5s

  # ============================================
  # 🗄️ H2 DATABASE
  # ============================================
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true